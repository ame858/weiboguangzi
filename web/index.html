<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ka 视频 SAR · 动目标阴影对比</title>
  <style>
    :root {
      /* Swiss International：白底、黑栏线、一支信号红。不用纯黑 */
      --paper: #ffffff;
      --ink: #141414;
      --ink-2: #5c5c5c;
      --ink-3: #8a8a8a;
      --rule: #141414;
      --rule-2: #d4d4d4;
      --rule-3: #e8e8e8;
      --red: #ff0000;
      --red-ink: #d40000;
      --stage: #141414;

      --sans: "Helvetica Neue", Helvetica, Arial, "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, "SF Mono", Consolas, "JetBrains Mono", monospace;
      --ease: 200ms ease-out;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font-family: var(--sans); font-size: 13.5px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ---------- top ---------- */
    .top {
      flex: 0 0 auto; height: 60px; display: flex; align-items: center; gap: 20px;
      padding: 0 24px; border-bottom: 1px solid var(--rule); z-index: 20; background: var(--paper);
    }
    .brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .brand-icon {
      width: 26px; height: 26px; display: grid; place-items: center;
      background: var(--ink); color: #fff; flex-shrink: 0;
    }
    .brand b { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
    .ctx {
      display: inline-flex; align-items: center; gap: 10px; min-width: 0;
      padding: 4px 0; font-size: 12px; color: var(--ink-2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ctx b { font-weight: 700; color: var(--ink); }
    .ctx .sep { color: var(--rule-2); margin: 0 2px; }
    .ctx-dot { width: 7px; height: 7px; background: var(--rule-2); flex-shrink: 0; }
    .ctx.live .ctx-dot { background: var(--red); }
    .top-spacer { flex: 1; }

    /* ---------- shell ---------- */
    .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 268px minmax(0, 1fr); }

    /* ---------- rail ---------- */
    .rail {
      min-height: 0; overflow-y: auto; background: var(--paper);
      border-right: 1px solid var(--rule);
      padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 22px;
    }
    .rail section { display: flex; flex-direction: column; gap: 10px; }
    .rail h2 {
      margin: 0; display: flex; align-items: center; gap: 10px;
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--ink);
    }
    .rail h2::before { content: ""; width: 20px; height: 2px; background: var(--ink); flex-shrink: 0; }

    .seg { display: flex; border-bottom: 1px solid var(--rule-2); }
    .seg button {
      flex: 1; border: none; background: none; padding: 8px 4px 7px; cursor: pointer;
      font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--ink-3);
      border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
      transition: color var(--ease), border-color var(--ease);
    }
    .seg button:hover { color: var(--ink); }
    .seg button.on { color: var(--ink); border-bottom-color: var(--red); }

    input[type="text"], input[type="number"], select {
      width: 100%; background: var(--paper); color: var(--ink);
      border: 1px solid var(--rule-2); border-radius: 0;
      padding: 7px 9px; font-family: inherit; font-size: 12.5px; outline: none;
      text-overflow: ellipsis;
      transition: border-color var(--ease);
    }
    input::placeholder { color: var(--ink-3); }
    input:hover, select:hover { border-color: var(--ink-3); }
    input:focus, select:focus { border-color: var(--red); }

    .pick-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .method-list { display: flex; flex-direction: column; }
    .method {
      display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 12px;
      border: none; border-left: 2px solid var(--rule-2); background: none;
      cursor: pointer; font-family: inherit; font-size: 12.5px; color: var(--ink-2);
      text-align: left; transition: background var(--ease), border-color var(--ease), color var(--ease);
    }
    .method:hover { background: #f4f4f4; color: var(--ink); border-left-color: var(--ink-3); }
    .method.on { color: var(--ink); border-left-color: var(--red); font-weight: 700; }
    .method .tick {
      width: 12px; height: 12px; border: 1px solid var(--ink-3); flex-shrink: 0;
      display: grid; place-items: center; color: transparent; font-size: 9px; line-height: 1;
    }
    .method.on .tick { background: var(--ink); border-color: var(--ink); color: #fff; }

    .rail details { border-top: 1px solid var(--rule-2); padding-top: 12px; }
    .rail summary {
      cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px;
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    }
    .rail summary::-webkit-details-marker { display: none; }
    .rail summary::before { content: ""; width: 20px; height: 2px; background: var(--ink); flex-shrink: 0; }
    .rail summary::after { content: "+"; margin-left: auto; color: var(--ink-3); font-weight: 400; }
    .rail details[open] summary::after { content: "–"; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    fieldset { border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
    .lbl { font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.02em; }

    .rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 16px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 12px; border: 1px solid var(--rule-2); border-radius: 0;
      background: var(--paper); color: var(--ink); font-family: inherit;
      font-size: 12px; font-weight: 700; letter-spacing: 0.02em; cursor: pointer;
      white-space: nowrap; transition: background var(--ease), border-color var(--ease), color var(--ease);
    }
    .btn:hover { background: #f4f4f4; border-color: var(--ink-3); }
    .btn-sm { padding: 6px 10px; font-size: 11.5px; }
    .btn-primary {
      background: var(--ink); border-color: var(--ink); color: #fff;
    }
    .btn-primary:hover { background: var(--red); border-color: var(--red); color: #fff; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; background: var(--ink); border-color: var(--ink); }
    .run-btn { width: 100%; height: 40px; font-size: 13px; letter-spacing: 0.04em; }

    .badge {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 2px 7px; border: 1px solid var(--rule-2); border-radius: 0;
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      background: var(--paper); color: var(--ink-2); white-space: nowrap;
    }
    .badge.ok { border-color: var(--ink); color: var(--ink); }
    .badge.warn { border-color: var(--red); color: var(--red-ink); }
    .badge.err { border-color: var(--red); color: #fff; background: var(--red-ink); }

    /* ---------- stage ---------- */
    .stage { min-height: 0; display: flex; flex-direction: column; padding: 12px 22px 16px; gap: 12px; position: relative; }
    .stage-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .icon-btn {
      width: 30px; height: 30px; border: 1px solid var(--rule-2); border-radius: 0; background: var(--paper);
      color: var(--ink-2); cursor: pointer; display: inline-grid; place-items: center; font-size: 11px;
      transition: border-color var(--ease), color var(--ease), background var(--ease);
    }
    .icon-btn:hover { color: var(--ink); border-color: var(--ink); background: #f4f4f4; }
    .play-btn {
      height: 30px; padding: 0 14px; border: 1px solid var(--ink); border-radius: 0;
      background: var(--ink); color: #fff; font-family: inherit; font-size: 12px; font-weight: 700;
      letter-spacing: 0.02em; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      transition: background var(--ease), border-color var(--ease);
    }
    .play-btn:hover { background: var(--red); border-color: var(--red); }
    .stage-bar select { width: auto; padding: 6px 9px; border-radius: 0; font-size: 12px; }

    .columns {
      flex: 1; min-height: 180px; display: grid; gap: 18px; justify-content: stretch;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    .col-head {
      display: flex; align-items: center; gap: 8px; padding: 0 0 6px;
      border-bottom: 1px solid var(--rule); margin-bottom: 8px;
    }
    .col-head select {
      width: auto; max-width: 68%; padding: 2px 2px 3px; border: none; border-radius: 0;
      font-size: 13px; font-weight: 700; background: transparent;
    }
    .col-head select:hover { color: var(--red-ink); }
    .col-head select:focus { border: none; color: var(--red-ink); }
    .col-head .f1 { margin-left: auto; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .col-img { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .col-img img {
      height: 100%; width: auto; max-width: 100%; display: block;
      border-radius: 0; background: var(--stage);
    }
    .col-foot {
      display: flex; gap: 16px; padding: 7px 1px 0; font-size: 11.5px; color: var(--ink-2);
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .col-foot .hot { color: var(--ink); font-weight: 700; }
    .slot-empty {
      flex: 1; min-height: 0; width: 100%; cursor: pointer; font-family: inherit;
      border: 1px dashed var(--rule-2); border-radius: 0; background: var(--paper);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      color: var(--ink-3); font-size: 12.5px; padding: 20px; text-align: center;
      transition: border-color var(--ease), color var(--ease), background var(--ease);
    }
    .slot-empty:hover { border-color: var(--red); color: var(--red-ink); background: #fffafa; }
    .slot-empty span:last-child { font-size: 11.5px; line-height: 1.6; }

    .pixelated img { image-rendering: pixelated; }

    .quad { flex: 1; min-height: 0; display: grid; gap: 14px; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: 1fr; }
    .quad figure { margin: 0; display: flex; flex-direction: column; min-height: 0; }
    .quad figcaption {
      font-size: 11.5px; color: var(--ink-3); padding: 0 2px 6px; display: flex; gap: 10px;
      justify-content: flex-start; align-items: baseline;
      border-bottom: 1px solid var(--rule-3); margin-bottom: 6px;
    }
    .quad figcaption span:first-child { color: var(--ink); font-weight: 700; font-size: 12px; }
    .quad figcaption span:last-child { letter-spacing: 0.06em; }
    .quad .col-img { background: transparent; overflow: visible; }
    .quad .col-img img { height: 100%; width: auto; max-width: 100%; border-radius: 0; background: var(--stage); }
    .tile-empty {
      height: 100%; aspect-ratio: 4 / 5; border: 1px dashed var(--rule-2);
      display: grid; place-items: center; color: var(--ink-3); font-size: 11.5px;
      text-align: center; padding: 10px;
    }
    .quad-bar { flex: 0 0 auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    @media (max-width: 1180px) {
      .quad { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    }

    /* 指标条：栏线分隔，不做卡片 */
    .pills {
      flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule-3);
    }
    .pillcard {
      padding: 8px 14px; display: flex; align-items: baseline; justify-content: space-between;
      gap: 8px; min-width: 0; border-right: 1px solid var(--rule-3);
    }
    .pillcard:last-child { border-right: none; }
    .pillcard span {
      font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase;
      white-space: nowrap;
    }
    .pillcard b {
      font-size: 19px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
      display: inline-flex; align-items: baseline; gap: 6px;
    }
    .pillcard b em { font-style: normal; font-size: 11px; font-weight: 400; }
    .pillcard .up { color: var(--ink); }
    .pillcard .down { color: var(--red-ink); }

    .strip { flex: 0 0 auto; display: flex; gap: 6px; overflow-x: auto; padding: 2px 1px 4px; min-height: 56px; }
    .strip button {
      flex: 0 0 auto; padding: 0; border: 2px solid transparent; border-radius: 0;
      background: var(--stage); cursor: pointer; overflow: hidden; line-height: 0; position: relative;
      transition: border-color var(--ease);
    }
    .strip button img { display: block; height: 44px; width: auto; }
    .strip button.on { border-color: var(--red); }
    .strip button i {
      position: absolute; right: 0; bottom: 0; font-style: normal; font-size: 9px;
      font-family: var(--mono); color: #fff; background: rgba(20, 20, 20, 0.72);
      padding: 0 3px;
    }

    .hint-line { flex: 0 0 auto; font-size: 11.5px; color: var(--ink-3); }
    .empty-note {
      flex: 1; display: grid; place-items: center; text-align: center; color: var(--ink-3);
      font-size: 13px; border: 1px dashed var(--rule-2); padding: 24px;
    }
    .terminal {
      flex: 0 0 auto; max-height: 120px; overflow: auto; margin: 0;
      background: var(--paper); color: var(--ink-2); border: 1px solid var(--rule-2);
      padding: 10px 12px; font-family: var(--mono); font-size: 11.5px; line-height: 1.6;
      white-space: pre-wrap; word-break: break-all;
    }

    .pop-wrap { position: relative; }
    .popover {
      position: absolute; right: 0; top: 34px; z-index: 30; width: 250px; background: var(--paper);
      border: 1px solid var(--rule); padding: 14px;
    }
    .popover .row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .popover .row:last-child { margin-bottom: 0; }
    .switch-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 6px 0; font-size: 12px; color: var(--ink-2); cursor: pointer;
    }
    .switch-row input[type="checkbox"] {
      appearance: none; -webkit-appearance: none; width: 32px; height: 16px; background: var(--paper);
      border: 1px solid var(--rule-2); border-radius: 0; position: relative; cursor: pointer;
      margin: 0; flex-shrink: 0; transition: background var(--ease), border-color var(--ease);
    }
    .switch-row input[type="checkbox"]::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px;
      background: var(--ink-3); transition: transform var(--ease), background var(--ease);
    }
    .switch-row input[type="checkbox"]:checked { border-color: var(--ink); background: var(--ink); }
    .switch-row input[type="checkbox"]:checked::after { transform: translateX(16px); background: #fff; }
    .dot { width: 7px; height: 7px; display: inline-block; margin-right: 6px; background: var(--ink); }

    .sheet {
      position: absolute; inset: 0; z-index: 25; background: rgba(255, 255, 255, 0.92);
      display: flex; padding: 24px;
    }
    .sheet-card {
      margin: auto; width: min(940px, 100%); max-height: 100%; overflow: auto;
      background: var(--paper); border: 1px solid var(--rule); padding: 20px 24px;
    }
    table.metrics { width: 100%; border-collapse: collapse; font-size: 12.5px; border-top: 2px solid var(--rule); }
    table.metrics th, table.metrics td { padding: 7px 12px; text-align: right; border-bottom: 1px solid var(--rule-3); }
    table.metrics th:first-child, table.metrics td:first-child { text-align: left; color: var(--ink-2); font-weight: 400; }
    table.metrics thead th {
      font-size: 10.5px; color: var(--ink-3); font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    table.metrics td.val { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    table.metrics .delta { font-size: 11px; font-weight: 400; margin-left: 6px; color: var(--ink-2); }
    table.metrics .delta.up { color: var(--ink); }
    table.metrics .delta.down { color: var(--red-ink); }
    table.metrics .delta.flat { color: var(--ink-3); }

    .video-stage { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
    video { width: 100%; height: 100%; min-height: 0; object-fit: contain; border-radius: 0; background: var(--stage); }
    .file-box { border: 1px dashed var(--rule-2); padding: 8px 10px; }
    input[type="file"] { width: 100%; font-size: 11.5px; color: var(--ink-2); cursor: pointer; }
    input[type="file"]::file-selector-button {
      margin-right: 10px; padding: 4px 8px; border: 1px solid var(--rule-2); border-radius: 0;
      background: var(--paper); color: var(--ink); font-family: inherit; font-size: 11.5px;
      font-weight: 700; cursor: pointer;
    }
    .crop-stage { background: var(--stage); padding: 6px; display: flex; justify-content: center; }
    #cropCanvas { max-width: 100%; max-height: 190px; cursor: crosshair; display: block; border-radius: 0; }

    .mono { font-variant-numeric: tabular-nums; }

    .hidden { display: none !important; }

    @media (max-width: 1180px) {
      .app { grid-template-columns: 244px minmax(0, 1fr); }
      .pills { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .pillcard:nth-child(2) { border-right: none; }
      .columns { gap: 14px; }
    }
    @media (max-width: 860px) {
      body { overflow: auto; }
      .app { display: block; }
      .rail { border-right: none; border-bottom: 1px solid var(--rule); }
      .columns { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9" opacity=".45"></circle>
          <circle cx="12" cy="12" r="4.5"></circle>
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path>
        </svg>
      </div>
      <b>Ka 视频 SAR · 阴影对比</b>
    </div>
    <div class="ctx" id="ctxChip"><span class="ctx-dot"></span><span id="ctxText">未选择输入</span></div>
    <div class="top-spacer"></div>
    <button class="btn btn-sm" id="btnAllMetrics">全部指标</button>
    <div class="pop-wrap">
      <button class="btn btn-sm" id="btnDisplay">显示</button>
      <div class="popover hidden" id="displayPop">
        <div class="row"><span class="lbl">灰度映射</span><select id="dispMode"></select></div>
        <div class="row"><span class="lbl">伪彩色</span><select id="dispCmap"></select></div>
        <div class="row"><span class="lbl">差分参考</span>
          <select id="dispDiff"><option value="median">短期历史中值</option><option value="previous">前一帧</option></select>
        </div>
        <label class="switch-row"><span>轻度去斑平滑</span><input type="checkbox" id="dispDenoise" /></label>
        <label class="switch-row"><span><span class="dot" style="background:#1e8e3e"></span>真值轮廓</span><input type="checkbox" id="dispTruth" checked /></label>
        <label class="switch-row"><span><span class="dot" style="background:#d93025"></span>预测轮廓</span><input type="checkbox" id="dispPred" checked /></label>
        <label class="switch-row"><span>像素锐化缩放</span><input type="checkbox" id="dispPixelated" checked /></label>
      </div>
    </div>
  </header>

  <div class="app">
    <!-- ============ rail ============ -->
    <aside class="rail">
      <section>
        <h2>输入</h2>
        <div class="seg" id="kindSeg">
          <button data-kind="sequence" class="on">图像序列</button>
          <button data-kind="video">实测视频</button>
        </div>
        <div id="seqPane" style="display:flex; flex-direction:column; gap:8px;">
          <select id="seqSelect"></select>
          <div class="pick-row">
            <button class="btn btn-sm" id="btnPickFolder">选择文件夹</button>
            <button class="btn btn-sm" id="btnPickFile">选择文件</button>
          </div>
        </div>
        <div id="videoPane" class="hidden" style="display:flex; flex-direction:column; gap:7px;">
          <div class="file-box"><input type="file" id="videoFile" accept=".mp4,.mov,.avi,.mkv" /></div>
          <input type="text" id="videoPath" placeholder="或本地视频路径" />
          <button class="btn btn-sm" id="btnVideoLoad">读取首帧</button>
        </div>
      </section>

      <section id="cropSection" class="hidden">
        <h2>识别区域</h2>
        <div class="crop-stage"><canvas id="cropCanvas"></canvas></div>
        <div class="lbl">首帧 <span id="dimLabel" class="mono"></span> · 拖拽框选</div>
        <label class="switch-row"><span>启用裁剪</span><input type="checkbox" id="useCrop" /></label>
        <div class="grid-2">
          <fieldset><span class="lbl">X</span><input type="number" id="cropX" min="0" value="0" /></fieldset>
          <fieldset><span class="lbl">Y</span><input type="number" id="cropY" min="0" value="0" /></fieldset>
          <fieldset><span class="lbl">宽</span><input type="number" id="cropW" min="2" value="100" /></fieldset>
          <fieldset><span class="lbl">高</span><input type="number" id="cropH" min="2" value="100" /></fieldset>
        </div>
        <button class="btn btn-sm" id="btnResetCrop">重置整幅</button>
      </section>

      <section>
        <h2>模型</h2>
        <div class="method-list" id="methodList">
          <button class="method on" data-method="threshold"><span class="tick">✓</span>局部暗度阈值</button>
          <button class="method on" data-method="difference"><span class="tick">✓</span>时序背景差分</button>
          <button class="method on" data-method="learned"><span class="tick">✓</span>U-Net 时序</button>
        </div>
        <div id="modelField">
          <span class="lbl">模型部署 JSON</span>
          <input type="text" id="modelPath" placeholder="留空用默认权重" />
        </div>
      </section>

      <details>
        <summary>高级</summary>
        <button class="btn btn-sm" id="btnReloadRuns" style="margin-top:16px; width:100%;">重新扫描 runs/</button>
        <div class="grid-2">
          <fieldset><span class="lbl">阈值</span><input type="number" id="advThreshold" step="0.01" placeholder="自动" /></fieldset>
          <fieldset><span class="lbl">最小面积</span><input type="number" id="advMinArea" value="4" min="1" /></fieldset>
          <fieldset><span class="lbl">关联门限</span><input type="number" id="advGate" value="12" step="0.5" /></fieldset>
          <fieldset><span class="lbl">匹配 IoU</span><input type="number" id="advIou" value="0.5" step="0.05" /></fieldset>
        </div>
        <fieldset style="margin-top:8px;"><span class="lbl">序列路径（手动输入）</span>
          <input type="text" id="seqPath" placeholder="粘贴绝对路径，回车加载" />
        </fieldset>
      </details>

      <div class="rail-foot">
        <button class="btn btn-primary run-btn" id="btnRun">运行检测</button>
        <span class="badge" id="runBadge">待运行</span>
      </div>
    </aside>

    <!-- ============ stage ============ -->
    <main class="stage">
      <div class="stage-bar">
        <span class="mono" id="frameLabel" style="font-size:15px; color:var(--ink-2); min-width:86px;">帧 0 / 0</span>
        <button class="play-btn" id="btnPlay">▶ 播放</button>
        <button class="icon-btn" id="btnPrev" title="上一帧 (←)">◀</button>
        <button class="icon-btn" id="btnNext" title="下一帧 (→)">▶</button>
        <div class="seg" id="viewSeg" style="margin-left:12px;">
          <button data-view="compare" class="on">并排</button>
          <button data-view="quad">四宫格</button>
        </div>
        <select id="fps" style="margin-left:auto;">
          <option value="4">4 FPS</option>
          <option value="8" selected>8 FPS</option>
          <option value="12">12 FPS</option>
          <option value="16">16 FPS</option>
        </select>
      </div>

      <div class="empty-note" id="stageEmpty">左侧选好序列与模型，点「运行检测」。已有结果会自动载入。</div>

      <div class="columns pixelated hidden" id="columns"></div>

      <div class="quad hidden" id="quad"></div>
      <div class="quad-bar hidden" id="quadBar">
        <select id="quadSource" style="max-width:220px;"></select>
        <button class="btn btn-sm" id="btnGif">导出 GIF</button>
        <button class="btn btn-sm" id="btnMp4">导出 MP4</button>
        <span class="lbl" id="exportStatus"></span>
      </div>

      <div class="video-stage hidden" id="videoStage">
        <video id="videoOverlay" controls playsinline></video>
        <div class="row" id="videoDownloads" style="display:flex; gap:8px;"></div>
      </div>

      <div class="hint-line hidden" id="colHint"></div>
      <div class="pills hidden" id="pills"></div>
      <div class="strip hidden" id="strip"></div>
      <pre class="terminal hidden" id="log"></pre>

      <div class="sheet hidden" id="metricSheet">
        <div class="sheet-card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <b style="font-size:14px; font-weight:500;">全部指标</b>
            <button class="btn btn-sm" id="btnCloseSheet">关闭</button>
          </div>
          <table class="metrics" id="metricTable"></table>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/app.js?v=4"></script>
</body>
</html>
