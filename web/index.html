<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ka 视频 SAR · 动目标阴影对比</title>
  <style>
    :root {
      /* Natural organic: 暖米底、亚麻卡片、深棕文字，四支低饱和辅色 */
      --cream: #faf6f1;
      --linen: #efe7db;
      --paper: #fffdfa;
      --bark: #5c4033;
      --bark-2: rgba(92, 64, 51, 0.74);
      --bark-3: rgba(92, 64, 51, 0.62);
      --line: rgba(92, 64, 51, 0.14);
      --line-2: rgba(92, 64, 51, 0.28);
      --sage: #8b9d77;
      --sage-ink: #566b47;
      --sage-soft: rgba(139, 157, 119, 0.18);
      --clay: #d4a373;
      --clay-ink: #8a5a2b;
      --clay-soft: rgba(212, 163, 115, 0.22);
      --lake: #75a191;
      --bad: #a3502f;
      --frame: #2b2320;

      --pill: 999px;
      --r-card: 32px;
      --r-input: 20px;
      --r-img: 24px;

      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --serif: "Fraunces", Georgia, "Songti SC", "SimSun", serif;
      --mono: "JetBrains Mono", "Roboto Mono", Consolas, monospace;

      --soft: 0 8px 24px rgba(92, 64, 51, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--cream); color: var(--bark);
      font-family: var(--sans); font-size: 15px; line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ---------- top ---------- */
    .top {
      flex: 0 0 auto; height: 76px; display: flex; align-items: center; gap: 20px;
      padding: 0 32px; background: var(--cream); z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .brand-icon {
      width: 38px; height: 38px; border-radius: 14px; display: grid; place-items: center; color: var(--cream);
      background: var(--bark); flex-shrink: 0;
    }
    .brand b { font-family: var(--serif); font-size: 20px; font-weight: 500; letter-spacing: -0.01em; }
    .ctx {
      display: inline-flex; align-items: center; gap: 10px; min-width: 0;
      padding: 10px 20px; border-radius: var(--pill); background: var(--paper); box-shadow: var(--soft);
      font-size: 14px; color: var(--bark-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ctx b { font-weight: 500; color: var(--bark); }
    .ctx .sep { color: var(--line-2); }
    .ctx-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); flex-shrink: 0; }
    .ctx.live .ctx-dot { background: var(--sage); }
    .top-spacer { flex: 1; }

    /* ---------- shell ---------- */
    .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr); }

    /* ---------- rail ---------- */
    .rail {
      min-height: 0; overflow-y: auto; background: var(--linen); border-radius: 0 var(--r-card) var(--r-card) 0;
      padding: 26px 24px 26px; display: flex; flex-direction: column; gap: 26px;
    }
    .rail section { display: flex; flex-direction: column; gap: 14px; }
    .rail h2 {
      margin: 0; font-family: var(--serif); font-size: 17px; font-weight: 500;
      color: var(--bark); letter-spacing: -0.01em;
    }
    .seg { display: inline-flex; background: rgba(92, 64, 51, 0.07); border-radius: var(--pill); padding: 5px; gap: 4px; }
    .seg button {
      flex: 1; border: none; background: transparent; color: var(--bark-2); padding: 10px 14px;
      border-radius: var(--pill); cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500;
      transition: background 0.25s ease, color 0.25s ease; white-space: nowrap;
    }
    .seg button:hover { color: var(--bark); }
    .seg button.on { background: var(--paper); color: var(--bark); box-shadow: 0 2px 8px rgba(92, 64, 51, 0.10); }

    input[type="text"], input[type="number"], select {
      width: 100%; background: var(--paper); color: var(--bark);
      border: 1px solid var(--line); border-radius: var(--r-input);
      padding: 13px 18px; font-family: inherit; font-size: 15px; outline: none;
      text-overflow: ellipsis;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    input::placeholder { color: var(--bark-3); }
    input:hover, select:hover { border-color: var(--line-2); }
    input:focus, select:focus { border-color: var(--sage); box-shadow: 0 0 0 3px rgba(139, 157, 119, 0.22); }

    .pick-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .method-list { display: flex; flex-direction: column; gap: 10px; }
    .method {
      display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: var(--r-input);
      border: 1px solid var(--line); background: var(--paper); cursor: pointer;
      font-family: inherit; font-size: 15px; color: var(--bark-2); text-align: left;
      transition: border-color 0.25s ease, background 0.25s ease, color 0.25s ease;
    }
    .method:hover { border-color: var(--line-2); }
    .method .tick {
      width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-2);
      flex-shrink: 0; display: grid; place-items: center; color: transparent; font-size: 12px;
      transition: background 0.25s ease, border-color 0.25s ease;
    }
    .method.on { border-color: var(--sage); background: var(--sage-soft); color: var(--bark); }
    .method.on .tick { background: var(--sage); border-color: var(--sage); color: var(--paper); }

    .rail details { border-top: 1px solid var(--line); padding-top: 18px; }
    .rail summary { cursor: pointer; font-family: var(--serif); font-size: 17px; color: var(--bark); list-style: none; }
    .rail summary::-webkit-details-marker { display: none; }
    .rail summary::after { content: " ▾"; font-size: 13px; color: var(--bark-3); }
    .rail details[open] summary::after { content: " ▴"; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    fieldset { border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .lbl { font-size: 13px; color: var(--bark-3); }

    .rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding-top: 20px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 26px; border-radius: var(--pill); border: 1px solid var(--line-2);
      background: var(--paper); color: var(--bark); font-family: inherit; font-size: 15px;
      font-weight: 500; letter-spacing: 0.01em; cursor: pointer; white-space: nowrap;
      transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }
    .btn:hover { background: var(--sage-soft); border-color: var(--sage); }
    .btn-sm { padding: 10px 18px; font-size: 14px; }
    .btn-primary { background: var(--bark); border-color: var(--bark); color: var(--cream); }
    .btn-primary:hover { background: #6d4d3e; border-color: #6d4d3e; color: var(--cream); }
    .btn-primary:active { background: var(--sage); border-color: var(--sage); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .run-btn { width: 100%; height: 54px; font-size: 16px; }

    .badge {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 6px 14px; border-radius: var(--pill); font-size: 13px; font-weight: 500;
      background: rgba(92, 64, 51, 0.08); color: var(--bark-2); white-space: nowrap;
    }
    .badge.ok { background: var(--sage-soft); color: var(--sage-ink); }
    .badge.warn { background: var(--clay-soft); color: var(--clay-ink); }
    .badge.err { background: rgba(163, 80, 47, 0.14); color: var(--bad); }

    /* ---------- stage ---------- */
    .stage { min-height: 0; display: flex; flex-direction: column; padding: 10px 30px 22px; gap: 16px; position: relative; }
    .stage-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .icon-btn {
      width: 42px; height: 42px; border-radius: 50%; border: none; background: transparent;
      color: var(--bark-2); cursor: pointer; display: inline-grid; place-items: center; font-size: 14px;
      transition: background 0.25s ease;
    }
    .icon-btn:hover { background: rgba(92, 64, 51, 0.08); color: var(--bark); }
    .play-btn {
      height: 42px; padding: 0 24px; border-radius: var(--pill); border: none; background: var(--bark);
      color: var(--cream); font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; transition: background 0.25s ease;
    }
    .play-btn:hover { background: #6d4d3e; }
    .stage-bar select { width: auto; padding: 10px 18px; border-radius: var(--pill); background: var(--paper); }

    .columns {
      flex: 1; min-height: 200px; display: grid; gap: 22px; justify-content: center;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; max-width: 680px; }
    .col-head { display: flex; align-items: center; gap: 12px; padding: 0 0 12px; }
    .col-head select {
      width: auto; max-width: 66%; padding: 9px 16px; border-radius: var(--pill); font-size: 15px;
      font-weight: 500; background: var(--paper);
    }
    .col-head .f1 { margin-left: auto; font-family: var(--mono); font-size: 15px; color: var(--bark-2); }
    .col-img {
      flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    }
    .col-img img {
      height: 100%; width: auto; max-width: 100%; display: block;
      border-radius: var(--r-img); background: var(--frame);
    }
    .col-foot {
      display: flex; gap: 20px; padding: 12px 2px 0; font-size: 13.5px; color: var(--bark-2);
      font-family: var(--mono); white-space: nowrap;
    }
    .col-foot .hot { color: var(--bark); }
    .slot-empty {
      flex: 1; min-height: 0; width: 100%; cursor: pointer; font-family: inherit;
      border: 1.5px dashed var(--line-2); border-radius: var(--r-img); background: rgba(255, 253, 250, 0.6);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      color: var(--bark-3); font-size: 15px; padding: 24px; text-align: center;
      transition: border-color 0.25s ease, background 0.25s ease, color 0.25s ease;
    }
    .slot-empty:hover { border-color: var(--sage); color: var(--sage-ink); background: var(--sage-soft); }
    .slot-empty span:last-child { font-size: 13.5px; line-height: 1.6; }

    .pixelated img { image-rendering: pixelated; }

    .quad {
      flex: 1; min-height: 0; display: grid; gap: 18px;
      grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: 1fr;
    }
    @media (max-width: 1180px) {
      .quad { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    }
    .quad figure { margin: 0; display: flex; flex-direction: column; min-height: 0; }
    .quad figcaption {
      font-size: 13px; color: var(--bark-3); padding: 0 4px 8px; display: flex; gap: 14px;
      align-self: center; width: fit-content; justify-content: center;
    }
    .tile-empty {
      height: 100%; aspect-ratio: 4 / 5; border-radius: 20px; background: rgba(92, 64, 51, 0.06);
      display: grid; place-items: center; color: var(--bark-3); font-size: 13.5px; text-align: center;
      padding: 12px;
    }
    .quad .col-img { border-radius: 0; background: transparent; overflow: visible; }
    .quad .col-img img { height: 100%; width: auto; max-width: 100%; border-radius: 20px; background: var(--frame); }
    .quad-bar { flex: 0 0 auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    .pills { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .pillcard {
      background: var(--paper); border-radius: 22px; box-shadow: var(--soft); padding: 14px 20px;
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px; min-width: 0;
    }
    .pillcard span { font-size: 13.5px; color: var(--bark-3); white-space: nowrap; }
    .pillcard b {
      font-family: var(--mono); font-size: 21px; font-weight: 500; letter-spacing: -0.02em;
      display: inline-flex; align-items: baseline; gap: 8px;
    }
    .pillcard b em { font-style: normal; font-size: 13px; font-weight: 500; }
    .pillcard .up { color: var(--sage-ink); }
    .pillcard .down { color: var(--bad); }

    .strip { flex: 0 0 auto; display: flex; gap: 10px; overflow-x: auto; padding: 2px 0 6px; min-height: 72px; }
    .strip button {
      flex: 0 0 auto; padding: 0; border: 2px solid transparent; border-radius: 14px;
      background: var(--frame); cursor: pointer; overflow: hidden; line-height: 0; position: relative;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .strip button img { display: block; height: 58px; width: auto; }
    .strip button:hover { transform: translateY(-2px); }
    .strip button.on { border-color: var(--sage); }
    .strip button i {
      position: absolute; right: 3px; bottom: 0; font-style: normal; font-size: 10px;
      font-family: var(--mono); color: #f0e7dc; background: rgba(43, 35, 32, 0.6);
      padding: 0 4px; border-radius: 4px;
    }

    .hint-line { flex: 0 0 auto; font-size: 13.5px; color: var(--bark-3); }
    .empty-note {
      flex: 1; display: grid; place-items: center; text-align: center; color: var(--bark-3);
      font-size: 15px; border: 1.5px dashed var(--line-2); border-radius: var(--r-card);
      background: rgba(255, 253, 250, 0.55); padding: 32px;
    }
    .terminal {
      flex: 0 0 auto; max-height: 132px; overflow: auto; margin: 0;
      background: var(--paper); color: var(--bark-2); border: 1px solid var(--line);
      border-radius: var(--r-input); padding: 16px 20px; font-family: var(--mono);
      font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-all;
    }

    .pop-wrap { position: relative; }
    .popover {
      position: absolute; right: 0; top: 52px; z-index: 30; width: 288px; background: var(--paper);
      border-radius: 24px; box-shadow: var(--soft); border: 1px solid var(--line); padding: 22px;
    }
    .popover .row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .popover .row:last-child { margin-bottom: 0; }
    .switch-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 8px 0; font-size: 14px; color: var(--bark-2); cursor: pointer;
    }
    .switch-row input[type="checkbox"] {
      appearance: none; -webkit-appearance: none; width: 46px; height: 26px; background: rgba(92, 64, 51, 0.16);
      border-radius: var(--pill); position: relative; cursor: pointer; margin: 0; flex-shrink: 0;
      transition: background 0.25s ease;
    }
    .switch-row input[type="checkbox"]::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
      border-radius: 50%; background: var(--paper); box-shadow: 0 1px 3px rgba(92, 64, 51, 0.25);
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1);
    }
    .switch-row input[type="checkbox"]:checked { background: var(--sage); }
    .switch-row input[type="checkbox"]:checked::after { transform: translateX(20px); }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 7px; }

    .sheet {
      position: absolute; inset: 0; z-index: 25; background: rgba(250, 246, 241, 0.78);
      backdrop-filter: blur(4px); display: flex; padding: 32px;
    }
    .sheet-card {
      margin: auto; width: min(960px, 100%); max-height: 100%; overflow: auto;
      background: var(--paper); border-radius: var(--r-card); box-shadow: var(--soft); padding: 28px 32px;
    }
    table.metrics { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.metrics th, table.metrics td { padding: 12px 16px; text-align: right; border-bottom: 1px solid var(--line); }
    table.metrics th:first-child, table.metrics td:first-child { text-align: left; color: var(--bark-2); font-weight: 400; }
    table.metrics thead th { font-size: 13px; color: var(--bark-3); font-weight: 500; }
    table.metrics td.val { font-family: var(--mono); font-size: 15px; font-weight: 500; }
    table.metrics .delta { font-family: var(--mono); font-size: 12.5px; margin-left: 6px; }
    table.metrics .delta.up { color: var(--sage-ink); }
    table.metrics .delta.down { color: var(--bad); }
    table.metrics .delta.flat { color: var(--bark-3); }

    .video-stage { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px; }
    video { width: 100%; height: 100%; min-height: 0; object-fit: contain; border-radius: var(--r-img); background: var(--frame); }
    .file-box { background: var(--paper); border: 1.5px dashed var(--line-2); border-radius: var(--r-input); padding: 10px 14px; }
    input[type="file"] { width: 100%; font-size: 14px; color: var(--bark-2); cursor: pointer; }
    input[type="file"]::file-selector-button {
      margin-right: 12px; padding: 8px 16px; border-radius: var(--pill); border: none;
      background: var(--sage-soft); color: var(--sage-ink); font-family: inherit; font-size: 14px;
      font-weight: 500; cursor: pointer;
    }
    .crop-stage { background: var(--frame); border-radius: var(--r-input); padding: 10px; display: flex; justify-content: center; }
    #cropCanvas { max-width: 100%; max-height: 220px; cursor: crosshair; display: block; border-radius: 12px; }

    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    .hidden { display: none !important; }

    @media (max-width: 1180px) {
      .app { grid-template-columns: 270px minmax(0, 1fr); }
      .pills { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .columns { gap: 16px; }
    }
    @media (max-width: 860px) {
      body { overflow: auto; }
      .app { display: block; }
      .rail { border-radius: 0; }
      .columns { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9" opacity=".45"></circle>
          <circle cx="12" cy="12" r="4.5"></circle>
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path>
        </svg>
      </div>
      <b>Ka 视频 SAR · 阴影对比</b>
    </div>
    <div class="ctx" id="ctxChip"><span class="ctx-dot"></span><span id="ctxText">未选择输入</span></div>
    <div class="top-spacer"></div>
    <button class="btn btn-sm" id="btnAllMetrics">全部指标</button>
    <div class="pop-wrap">
      <button class="btn btn-sm" id="btnDisplay">显示</button>
      <div class="popover hidden" id="displayPop">
        <div class="row"><span class="lbl">灰度映射</span><select id="dispMode"></select></div>
        <div class="row"><span class="lbl">伪彩色</span><select id="dispCmap"></select></div>
        <div class="row"><span class="lbl">差分参考</span>
          <select id="dispDiff"><option value="median">短期历史中值</option><option value="previous">前一帧</option></select>
        </div>
        <label class="switch-row"><span>轻度去斑平滑</span><input type="checkbox" id="dispDenoise" /></label>
        <label class="switch-row"><span><span class="dot" style="background:#1e8e3e"></span>真值轮廓</span><input type="checkbox" id="dispTruth" checked /></label>
        <label class="switch-row"><span><span class="dot" style="background:#d93025"></span>预测轮廓</span><input type="checkbox" id="dispPred" checked /></label>
        <label class="switch-row"><span>像素锐化缩放</span><input type="checkbox" id="dispPixelated" checked /></label>
      </div>
    </div>
  </header>

  <div class="app">
    <!-- ============ rail ============ -->
    <aside class="rail">
      <section>
        <h2>输入</h2>
        <div class="seg" id="kindSeg">
          <button data-kind="sequence" class="on">图像序列</button>
          <button data-kind="video">实测视频</button>
        </div>
        <div id="seqPane" style="display:flex; flex-direction:column; gap:8px;">
          <select id="seqSelect"></select>
          <div class="pick-row">
            <button class="btn btn-sm" id="btnPickFolder">选择文件夹</button>
            <button class="btn btn-sm" id="btnPickFile">选择文件</button>
          </div>
        </div>
        <div id="videoPane" class="hidden" style="display:flex; flex-direction:column; gap:7px;">
          <div class="file-box"><input type="file" id="videoFile" accept=".mp4,.mov,.avi,.mkv" /></div>
          <input type="text" id="videoPath" placeholder="或本地视频路径" />
          <button class="btn btn-sm" id="btnVideoLoad">读取首帧</button>
        </div>
      </section>

      <section id="cropSection" class="hidden">
        <h2>识别区域</h2>
        <div class="crop-stage"><canvas id="cropCanvas"></canvas></div>
        <div class="lbl">首帧 <span id="dimLabel" class="mono"></span> · 拖拽框选</div>
        <label class="switch-row"><span>启用裁剪</span><input type="checkbox" id="useCrop" /></label>
        <div class="grid-2">
          <fieldset><span class="lbl">X</span><input type="number" id="cropX" min="0" value="0" /></fieldset>
          <fieldset><span class="lbl">Y</span><input type="number" id="cropY" min="0" value="0" /></fieldset>
          <fieldset><span class="lbl">宽</span><input type="number" id="cropW" min="2" value="100" /></fieldset>
          <fieldset><span class="lbl">高</span><input type="number" id="cropH" min="2" value="100" /></fieldset>
        </div>
        <button class="btn btn-sm" id="btnResetCrop">重置整幅</button>
      </section>

      <section>
        <h2>模型</h2>
        <div class="method-list" id="methodList">
          <button class="method on" data-method="threshold"><span class="tick">✓</span>局部暗度阈值</button>
          <button class="method on" data-method="difference"><span class="tick">✓</span>时序背景差分</button>
          <button class="method on" data-method="learned"><span class="tick">✓</span>U-Net 时序</button>
        </div>
        <div id="modelField">
          <span class="lbl">模型部署 JSON</span>
          <input type="text" id="modelPath" placeholder="留空用默认权重" />
        </div>
      </section>

      <details>
        <summary>高级</summary>
        <button class="btn btn-sm" id="btnReloadRuns" style="margin-top:16px; width:100%;">重新扫描 runs/</button>
        <div class="grid-2">
          <fieldset><span class="lbl">阈值</span><input type="number" id="advThreshold" step="0.01" placeholder="自动" /></fieldset>
          <fieldset><span class="lbl">最小面积</span><input type="number" id="advMinArea" value="4" min="1" /></fieldset>
          <fieldset><span class="lbl">关联门限</span><input type="number" id="advGate" value="12" step="0.5" /></fieldset>
          <fieldset><span class="lbl">匹配 IoU</span><input type="number" id="advIou" value="0.5" step="0.05" /></fieldset>
        </div>
        <fieldset style="margin-top:8px;"><span class="lbl">序列路径（手动输入）</span>
          <input type="text" id="seqPath" placeholder="粘贴绝对路径，回车加载" />
        </fieldset>
      </details>

      <div class="rail-foot">
        <button class="btn btn-primary run-btn" id="btnRun">运行检测</button>
        <span class="badge" id="runBadge">待运行</span>
      </div>
    </aside>

    <!-- ============ stage ============ -->
    <main class="stage">
      <div class="stage-bar">
        <span class="mono" id="frameLabel" style="font-size:15px; color:var(--bark-2); min-width:86px;">帧 0 / 0</span>
        <button class="play-btn" id="btnPlay">▶ 播放</button>
        <button class="icon-btn" id="btnPrev" title="上一帧 (←)">◀</button>
        <button class="icon-btn" id="btnNext" title="下一帧 (→)">▶</button>
        <div class="seg" id="viewSeg" style="margin-left:12px;">
          <button data-view="compare" class="on">并排</button>
          <button data-view="quad">四宫格</button>
        </div>
        <select id="fps" style="margin-left:auto;">
          <option value="4">4 FPS</option>
          <option value="8" selected>8 FPS</option>
          <option value="12">12 FPS</option>
          <option value="16">16 FPS</option>
        </select>
      </div>

      <div class="empty-note" id="stageEmpty">左侧选好序列与模型，点「运行检测」。已有结果会自动载入。</div>

      <div class="columns pixelated hidden" id="columns"></div>

      <div class="quad hidden" id="quad"></div>
      <div class="quad-bar hidden" id="quadBar">
        <select id="quadSource" style="max-width:220px;"></select>
        <button class="btn btn-sm" id="btnGif">导出 GIF</button>
        <button class="btn btn-sm" id="btnMp4">导出 MP4</button>
        <span class="lbl" id="exportStatus"></span>
      </div>

      <div class="video-stage hidden" id="videoStage">
        <video id="videoOverlay" controls playsinline></video>
        <div class="row" id="videoDownloads" style="display:flex; gap:8px;"></div>
      </div>

      <div class="hint-line hidden" id="colHint"></div>
      <div class="pills hidden" id="pills"></div>
      <div class="strip hidden" id="strip"></div>
      <pre class="terminal hidden" id="log"></pre>

      <div class="sheet hidden" id="metricSheet">
        <div class="sheet-card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <b style="font-size:14px; font-weight:500;">全部指标</b>
            <button class="btn btn-sm" id="btnCloseSheet">关闭</button>
          </div>
          <table class="metrics" id="metricTable"></table>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/app.js?v=4"></script>
</body>
</html>
