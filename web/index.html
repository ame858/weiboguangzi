<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ka 视频 SAR · 动目标阴影对比</title>
  <style>
    :root {
      /* Gemini 语言：灰白底、白浮层、灰组件；蓝只留给一次性提示条 */
      --canvas: #f7f8f9;
      --surface: #ffffff;
      --field: #f0f1f3;
      --field-hover: #e8eaed;
      --pressed: #e8eaed;
      --pressed-hover: #e0e3e6;
      --on: #1f1f1f;
      --on-2: #5f6368;
      --on-3: #80868b;
      --outline: #e6e8ea;
      --outline-2: #d9dce0;
      --cta: #2b2d31;
      --cta-hover: #151619;
      --cta-disabled: #d9dce0;
      --ok: #1e8e3e;
      --warn: #a86800;
      --err: #b3261e;
      --stage: #1f1f1f;

      /* 数据色：必须与 videosar_ui.imaging 实际绘制值一致（TRUTH 64,235,120 / PRED 255,92,92
         / CROP 255,64,64），改这里等于改图例含义，不随界面色板统一调整 */
      --viz-truth: #40eb78;
      --viz-pred: #ff5c5c;
      --viz-crop: #ff4040;

      /* M3 shape scale */
      --r-xs: 4px;
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
      --r-xl: 28px;
      --r-full: 999px;

      --shadow-1: 0 1px 2px rgba(60, 64, 67, 0.06), 0 1px 3px 1px rgba(60, 64, 67, 0.04);
      --shadow-2: 0 2px 6px rgba(60, 64, 67, 0.10), 0 8px 24px rgba(60, 64, 67, 0.07);
      --shadow-inset: inset 0 1px 2px rgba(60, 64, 67, 0.10);
      --t-fast: 120ms;
      --t-base: 180ms;
      --t-mid: 240ms;
      --t-slow: 300ms;
      --e-standard: cubic-bezier(0.2, 0, 0, 1);
      --e-emphasized: cubic-bezier(0.4, 0, 0.2, 1);
      --ease: 200ms cubic-bezier(0.2, 0, 0, 1);

      --sans: "Google Sans", "Product Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "Roboto Mono", "JetBrains Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--canvas); color: var(--on);
      font-family: var(--sans); font-size: 14px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ---------- rail head：品牌与上下文并进左栏，不再有顶栏 ---------- */
    .rail-head { display: flex; flex-direction: column; gap: 8px; padding-bottom: 16px; border-bottom: 1px solid var(--outline); }
    .brand { display: flex; align-items: center; gap: 9px; }
    .brand-icon {
      width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
      background: var(--cta); color: #fff; flex-shrink: 0;
    }
    .brand b { font-size: 14px; font-weight: 500; letter-spacing: -0.1px; }
    .ctx {
      display: flex; align-items: center; gap: 7px; min-width: 0;
      font-size: 11.5px; color: var(--on-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ctx b { font-weight: 500; color: var(--on-2); }
    .ctx .sep { color: var(--outline-2); }
    .ctx-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--outline-2); flex-shrink: 0; }
    .ctx.live .ctx-dot { background: var(--ok); }

    /* ---------- shell ---------- */
    .app {
      flex: 1; min-height: 0; display: grid; grid-template-columns: 288px minmax(0, 1fr);
      gap: 16px; padding: 16px 20px 20px;
    }

    /* ---------- rail: 28dp 浮层 ---------- */
    .rail {
      min-height: 0; overflow-y: auto; background: var(--surface);
      border-radius: var(--r-xl); box-shadow: var(--shadow-1);
      padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 22px;
    }
    .rail section { display: flex; flex-direction: column; gap: 10px; }
    .rail h2 {
      margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 0.4px;
      color: var(--on-3); text-transform: uppercase;
    }

    .seg { display: flex; background: var(--field); border-radius: var(--r-full); padding: 3px; gap: 2px; }
    .seg button {
      flex: 1; border: none; background: none; padding: 7px 10px; border-radius: var(--r-full);
      cursor: pointer; font-family: inherit; font-size: 12.5px; font-weight: 500;
      color: var(--on-2); white-space: nowrap; transition: background var(--ease), color var(--ease);
    }
    .seg button:hover { color: var(--on); }
    .seg button.on { background: var(--surface); color: var(--on); box-shadow: var(--shadow-1); }

    input[type="text"], input[type="number"], select {
      width: 100%; height: 40px; background: var(--field); color: var(--on);
      border: 1px solid transparent; border-radius: var(--r-sm);
      padding: 0 12px; font-family: inherit; font-size: 13px; outline: none;
      text-overflow: ellipsis; transition: box-shadow var(--ease), border-color var(--ease), background var(--ease);
    }
    input::placeholder { color: var(--on-3); }
    input:hover, select:hover { background: var(--field-hover); }
    input:focus, select:focus { background: var(--surface); border-color: var(--outline-2); box-shadow: 0 0 0 2px rgba(31, 31, 31, 0.10); }

    .pick-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .method-list { display: flex; flex-direction: column; gap: 8px; }
    .method {
      display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px;
      border: 1px solid var(--outline-2); border-radius: var(--r-sm); background: var(--surface);
      cursor: pointer; font-family: inherit; font-size: 13px; color: var(--on-2);
      text-align: left; transition: background var(--ease), border-color var(--ease), color var(--ease);
    }
    .method:hover { background: var(--field); }
    .method.on:hover { background: var(--pressed-hover); }
    .method .tick {
      width: 18px; height: 18px; border: 1.5px solid var(--outline-2); border-radius: var(--r-xs);
      flex-shrink: 0; display: grid; place-items: center; color: transparent;
    }
    .method.on {
      background: var(--pressed); border-color: transparent; color: var(--on); font-weight: 500;
      box-shadow: var(--shadow-inset);
    }
    .method.on .tick { background: var(--cta); border-color: var(--cta); color: #fff; }

    .rail details { border-top: 1px solid var(--outline); padding-top: 14px; }
    .rail summary {
      cursor: pointer; list-style: none; font-size: 12px; font-weight: 500;
      letter-spacing: 0.4px; text-transform: uppercase; color: var(--on-3);
      display: flex; align-items: center;
    }
    .rail summary::-webkit-details-marker { display: none; }
    .rail summary::after {
      content: ""; margin-left: auto; width: 7px; height: 7px; flex-shrink: 0;
      border-right: 1.6px solid var(--on-3); border-bottom: 1.6px solid var(--on-3);
      transform: rotate(45deg) translateY(-2px); transition: transform var(--ease);
    }
    .rail details[open] summary::after { transform: rotate(225deg) translateX(-2px); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    fieldset { border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .lbl { font-size: 11.5px; color: var(--on-3); }

    .rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 16px; }
    .rail-foot .badge { align-self: center; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 40px; padding: 0 20px; border: none; border-radius: var(--r-full);
      background: var(--field); color: var(--on-2); font-family: inherit;
      font-size: 13px; font-weight: 500; letter-spacing: 0.1px; cursor: pointer;
      white-space: nowrap; transition: background var(--ease), color var(--ease), box-shadow var(--ease);
    }
    .btn:hover { background: var(--field-hover); color: var(--on); }
    .btn-sm { height: 34px; padding: 0 14px; font-size: 12.5px; }
    .btn-primary { background: var(--cta); color: #fff; }
    .btn-primary:hover { background: var(--cta-hover); color: #fff; }
    .btn-primary:disabled { background: var(--cta-disabled); color: var(--on-3); cursor: not-allowed; box-shadow: none; }
    .run-btn { width: 100%; height: 44px; font-size: 14px; }

    .badge {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 24px; padding: 0 10px; border-radius: var(--r-full);
      font-size: 11.5px; font-weight: 500; background: var(--field); color: var(--on-2);
      white-space: nowrap;
    }
    .badge.ok { background: #e9f2ea; color: var(--ok); }
    .badge.warn { background: #fbf3e4; color: var(--warn); }
    .badge.err { background: #f8e9e7; color: var(--err); }

    /* ---------- stage ---------- */
    .stage { min-height: 0; display: flex; flex-direction: column; gap: 12px; position: relative; }
    .stage .btn { background: var(--surface); box-shadow: var(--shadow-1); }
    .stage .btn:hover { background: var(--field); }
    .stage-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent;
      color: var(--on-2); cursor: pointer; display: inline-grid; place-items: center;
      transition: background var(--ease), color var(--ease);
    }
    .icon-btn:hover { background: rgba(68, 71, 70, 0.08); color: var(--on); }
    .play-btn {
      height: 36px; padding: 0 18px 0 14px; border-radius: var(--r-full);
      background: var(--surface); color: var(--on); border: 1px solid var(--outline-2);
      font-family: inherit; font-size: 13px;
      font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      transition: background var(--ease), border-color var(--ease);
    }
    .play-btn:hover { background: var(--field-hover); }
    .stage-bar select { width: auto; height: 36px; padding: 0 12px; border-radius: var(--r-full); background: var(--surface); }

    .columns {
      flex: 1; min-height: 180px; display: grid; gap: 16px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .col {
      display: flex; flex-direction: column; min-height: 0; min-width: 0;
      background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-1); overflow: hidden;
    }
    .col-head {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 12px;
      border-bottom: 1px solid var(--outline); flex: 0 0 auto;
    }
    .col-head select {
      width: auto; max-width: 70%; height: 28px; padding: 0 4px; background: transparent;
      border: none; border-radius: var(--r-xs); font-size: 13px; font-weight: 500; color: var(--on);
    }
    .col-head select:hover { background: var(--field); color: var(--on); }
    .col-head select:focus { background: var(--field); border-color: transparent; box-shadow: none; }
    .col-head .f1 { margin-left: auto; font-size: 12px; color: var(--on-3); font-variant-numeric: tabular-nums; }
    .col-img { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: var(--field); margin: 10px; border-radius: var(--r-sm); overflow: hidden; }
    .col-img img { height: 100%; width: auto; max-width: 100%; display: block; border-radius: var(--r-xs); background: var(--stage); }
    .col-foot {
      display: flex; gap: 14px; padding: 0 12px 10px; font-size: 11.5px; color: var(--on-3);
      font-variant-numeric: tabular-nums; white-space: nowrap; flex: 0 0 auto;
    }
    .col-foot .hot { color: var(--on); font-weight: 500; }
    .slot-empty {
      flex: 1; min-height: 0; width: 100%; cursor: pointer; font-family: inherit;
      border: 1px dashed var(--outline); border-radius: var(--r-md); background: rgba(255, 255, 255, 0.6);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      color: var(--on-3); font-size: 13px; padding: 20px; text-align: center;
      transition: border-color var(--ease), color var(--ease), background var(--ease);
    }
    .slot-empty:hover { border-color: var(--outline-2); color: var(--on-2); background: var(--field); }
    .slot-empty span:last-child { font-size: 11.5px; line-height: 1.6; }

    .pixelated img { image-rendering: pixelated; }

    .quad { flex: 1; min-height: 0; display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: 1fr; }
    .quad figure {
      margin: 0; display: flex; flex-direction: column; min-height: 0;
      background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-1);
      padding: 8px; overflow: hidden;
    }
    .quad figcaption {
      font-size: 11.5px; color: var(--on-3); padding: 2px 2px 6px; display: flex; gap: 8px;
      justify-content: space-between; align-items: baseline;
    }
    .quad figcaption span:first-child { color: var(--on-2); font-weight: 500; }
    .quad .col-img { background: var(--field); margin: 0; border-radius: var(--r-sm); }
    .quad .col-img img { height: 100%; width: auto; max-width: 100%; border-radius: var(--r-xs); background: var(--stage); }
    .tile-empty {
      height: 100%; aspect-ratio: 4 / 5; border-radius: var(--r-sm); background: var(--field);
      display: grid; place-items: center; color: var(--on-3); font-size: 12.5px;
      text-align: center; padding: 10px; line-height: 1.7;
    }
    .quad-bar { flex: 0 0 auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    @media (max-width: 1180px) {
      .quad { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    }

    /* 指标条：一块浮层切四段 */
    .pills {
      flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-1);
      overflow: hidden;
    }
    .pillcard {
      padding: 10px 16px; display: flex; align-items: baseline; justify-content: space-between;
      gap: 8px; min-width: 0; border-right: 1px solid var(--outline);
    }
    .pillcard:last-child { border-right: none; }
    .pillcard span { font-size: 11.5px; color: var(--on-3); white-space: nowrap; }
    .pillcard b {
      font-size: 18px; font-weight: 500; letter-spacing: -0.2px; font-variant-numeric: tabular-nums;
      display: inline-flex; align-items: baseline; gap: 6px;
    }
    .pillcard b em { font-style: normal; font-size: 11px; font-weight: 500; }
    .pillcard .up { color: var(--ok); }
    .pillcard .down { color: var(--err); }

    /* padding 必须 ≥4px：焦点环外沿 = box-shadow 2 + offset 2 + width 2 = 4px，
   容器又是 clip 边界，小于 4px 会切环。4px 同时是 min-height 60 下的唯一解：
   按钮高 52（48 img + 2×2 border），52 + 2×padding = 60。 */
    .strip { flex: 0 0 auto; display: flex; gap: 8px; overflow-x: auto; padding: 4px; min-height: 60px; }
    .strip button {
      flex: 0 0 auto; padding: 0; border: 2px solid transparent; border-radius: var(--r-sm);
      background: var(--stage); cursor: pointer; overflow: hidden; line-height: 0; position: relative;
      box-shadow: 0 0 0 0 transparent;
      transition: box-shadow var(--ease), transform var(--t-fast) var(--e-standard);
    }
    .strip button img { display: block; height: 48px; width: auto; }
    .strip button.on { border-color: transparent; box-shadow: 0 0 0 2px var(--cta); }
    .strip button:active { transform: scale(0.96); }
    .strip button i {
      position: absolute; right: 0; bottom: 0; font-style: normal; font-size: 9px;
      font-family: var(--mono); color: #fff; background: rgba(31, 31, 31, 0.66); padding: 0 3px;
    }

    .hint-line { flex: 0 0 auto; font-size: 11.5px; color: var(--on-3); }
    .empty-note {
      flex: 1; display: grid; place-items: center; text-align: center; color: var(--on-3);
      font-size: 13px; border: 1px dashed var(--outline); border-radius: var(--r-md); padding: 24px;
    }
    .run-steps {
      flex: 0 0 auto; max-height: 214px; display: flex; flex-direction: column; overflow: hidden;
      background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-1);
    }
    .run-head {
      flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; cursor: pointer; user-select: none;
    }
    /* padding-top 是滚动内容区的一部分：首行从它下方进入遮罩带，不会在 t=0 被削掉 */
    .steps-body {
      overflow: auto; padding: 12px 14px 10px;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 12px);
      mask-image: linear-gradient(to bottom, transparent 0, #000 12px);
    }
    .run-steps.collapsed { max-height: none; }
    .run-steps.collapsed .steps-body { display: none; }
    .run-title { font-size: 12.5px; color: var(--on-2); }
    .link-btn {
      margin-left: auto; border: none; background: none; padding: 0;
      font-family: inherit; font-size: 11.5px; color: var(--on-3); cursor: pointer;
      text-decoration: underline; text-underline-offset: 2px;
    }
    .link-btn:hover { color: var(--on); }
    .dots { position: relative; width: 14px; height: 14px; flex: 0 0 auto; animation: orbit 600ms linear infinite; }
    .dots i {
      position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--cta);
      animation: twinkle 600ms ease-in-out infinite;
    }
    .dots i:nth-child(1) { top: 0; left: 5px; }
    .dots i:nth-child(2) { bottom: 1px; left: 0; animation-delay: 200ms; }
    .dots i:nth-child(3) { bottom: 1px; right: 0; animation-delay: 400ms; }
    .dots.done { animation: none; }
    .dots.done i { animation: none; opacity: 0.35; }
    @keyframes orbit { to { transform: rotate(1turn); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

    .steps { display: flex; flex-direction: column; }
    .step {
      display: flex; align-items: baseline; gap: 10px;
      padding: 5px 0 5px 12px; border-left: 1px solid var(--outline-2);
      font-size: 12.5px; color: var(--on);
      animation: stepIn var(--t-base) var(--e-standard) both;
      transition: color var(--t-slow) var(--e-emphasized);
    }
    .step.done { color: var(--on-3); }
    .step.group { margin-top: 8px; font-weight: 500; border-left-color: var(--cta); }
    .step .idx { color: var(--on-3); font-variant-numeric: tabular-nums; min-width: 16px; }
    .step .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @keyframes stepIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    .terminal {
      flex: 0 0 auto; max-height: 120px; overflow: auto; margin: 0;
      background: var(--surface); color: var(--on-2); border: 1px solid var(--outline-2);
      border-radius: var(--r-md); padding: 10px 12px; font-family: var(--mono);
      font-size: 11.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-all;
    }

    .pop-wrap { position: relative; }
    .popover {
      position: absolute; right: 0; top: 40px; z-index: 30; width: 252px; background: var(--surface);
      border-radius: var(--r-lg); box-shadow: var(--shadow-2); padding: 16px;
      animation: popIn var(--t-base) var(--e-standard) both;
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(-4px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    .popover .row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .popover .row:last-child { margin-bottom: 0; }
    .switch-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 6px 0; font-size: 12.5px; color: var(--on-2); cursor: pointer;
    }
    .switch-row input[type="checkbox"] {
      appearance: none; -webkit-appearance: none; width: 44px; height: 26px; background: var(--outline-2);
      border-radius: var(--r-full); position: relative; cursor: pointer; margin: 0; flex-shrink: 0;
      transition: background var(--ease);
    }
    .switch-row input[type="checkbox"]::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
      border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      transition: transform var(--ease);
    }
    .switch-row input[type="checkbox"]:checked { background: var(--cta); }
    .switch-row input[type="checkbox"]:checked::after { transform: translateX(18px); }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; box-shadow: 0 0 0 1px rgba(31, 31, 31, 0.14); }

    .sheet {
      position: absolute; inset: 0; z-index: 25; background: var(--canvas);
      display: flex; padding: 24px;
      animation: fadeIn var(--t-mid) var(--e-emphasized) both;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .sheet-card {
      margin: auto; width: min(920px, 100%); max-height: 100%; overflow: auto;
      background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--shadow-2); padding: 22px 24px;
      animation: sheetIn var(--t-mid) var(--e-standard) both;
    }
    @keyframes sheetIn {
      from { opacity: 0; transform: translateY(12px) scale(0.985); }
      to { opacity: 1; transform: none; }
    }
    table.metrics { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.metrics th, table.metrics td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--outline); }
    table.metrics th:first-child, table.metrics td:first-child { text-align: left; color: var(--on-2); font-weight: 400; }
    table.metrics thead th { font-size: 11.5px; color: var(--on-3); font-weight: 500; }
    table.metrics td.val { font-size: 13.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
    table.metrics .delta { font-size: 11px; font-weight: 400; margin-left: 5px; color: var(--on-3); }
    table.metrics .delta.up { color: var(--ok); }
    table.metrics .delta.down { color: var(--err); }
    table.metrics .delta.flat { color: var(--on-3); }

    .video-stage { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
    video { width: 100%; height: 100%; min-height: 0; object-fit: contain; border-radius: var(--r-md); background: var(--stage); }
    .file-box { background: var(--field); border-radius: var(--r-sm); padding: 6px 8px; }
    input[type="file"] { width: 100%; font-size: 11.5px; color: var(--on-2); cursor: pointer; }
    input[type="file"]::file-selector-button {
      margin-right: 10px; padding: 5px 12px; border: none; border-radius: var(--r-full);
      background: var(--surface); color: var(--on-2); font-family: inherit; font-size: 11.5px;
      font-weight: 500; cursor: pointer; box-shadow: var(--shadow-1);
    }
    .crop-stage { background: var(--stage); border-radius: var(--r-sm); padding: 6px; display: flex; justify-content: center; }
    #cropCanvas { max-width: 100%; max-height: 190px; cursor: crosshair; display: block; border-radius: var(--r-xs); }

    .mono { font-variant-numeric: tabular-nums; }

    .btn:active:not(:disabled), .play-btn:active, .method:active { transform: scale(0.98); }
    .btn, .play-btn, .method, .icon-btn { transition: background var(--ease), color var(--ease), transform var(--t-fast) var(--e-standard); }

    .btn:focus-visible, .icon-btn:focus-visible, .play-btn:focus-visible, .method:focus-visible,
    .seg button:focus-visible, .switch-row input:focus-visible, .strip button:focus-visible,
    .slot-empty:focus-visible, .link-btn:focus-visible {
      outline: 2px solid var(--on-2); outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .step, .popover, .sheet, .sheet-card, .dots i { animation: none !important; }
      .btn, .play-btn, .method, .icon-btn { transition: none !important; }
    }

    .hidden { display: none !important; }

    @media (max-width: 1180px) {
      .app { grid-template-columns: 260px minmax(0, 1fr); gap: 12px; }
      .pills { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .pillcard:nth-child(2) { border-right: none; }
      .columns { gap: 12px; }
    }
    @media (max-width: 860px) {
      body { overflow: auto; }
      .app { display: block; padding: 0 12px 12px; }
      .rail { margin-bottom: 12px; }
      .columns { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>


  <div class="app">
    <!-- ============ rail ============ -->
    <aside class="rail">
      <div class="rail-head">
        <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9" opacity=".45"></circle>
          <circle cx="12" cy="12" r="4.5"></circle>
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path>
        </svg>
      </div>
      <b>Ka 视频 SAR</b>
    </div>
    <div class="ctx" id="ctxChip"><span class="ctx-dot"></span><span id="ctxText">未选择输入</span></div>
      </div>

      <section>
        <h2>输入</h2>
        <div class="seg" id="kindSeg">
          <button data-kind="sequence" class="on">图像序列</button>
          <button data-kind="video">实测视频</button>
        </div>
        <div id="seqPane" style="display:flex; flex-direction:column; gap:8px;">
          <select id="seqSelect"></select>
          <div class="pick-row">
            <button class="btn btn-sm" id="btnPickFolder">选择文件夹</button>
            <button class="btn btn-sm" id="btnPickFile">选择文件</button>
          </div>
        </div>
        <div id="videoPane" class="hidden" style="display:flex; flex-direction:column; gap:7px;">
          <div class="file-box"><input type="file" id="videoFile" accept=".mp4,.mov,.avi,.mkv" /></div>
          <input type="text" id="videoPath" placeholder="或本地视频路径" />
          <button class="btn btn-sm" id="btnVideoLoad">读取首帧</button>
        </div>
      </section>

      <section id="cropSection" class="hidden">
        <h2>识别区域</h2>
        <div class="crop-stage"><canvas id="cropCanvas"></canvas></div>
        <div class="lbl">首帧 <span id="dimLabel" class="mono"></span> · 拖拽框选</div>
        <label class="switch-row"><span>启用裁剪</span><input type="checkbox" id="useCrop" /></label>
        <div class="grid-2">
          <fieldset><span class="lbl">X</span><input type="number" id="cropX" min="0" value="0" /></fieldset>
          <fieldset><span class="lbl">Y</span><input type="number" id="cropY" min="0" value="0" /></fieldset>
          <fieldset><span class="lbl">宽</span><input type="number" id="cropW" min="2" value="100" /></fieldset>
          <fieldset><span class="lbl">高</span><input type="number" id="cropH" min="2" value="100" /></fieldset>
        </div>
        <button class="btn btn-sm" id="btnResetCrop">重置整幅</button>
      </section>

      <section>
        <h2>模型</h2>
        <div class="method-list" id="methodList">
          <button class="method on" data-method="threshold"><span class="tick">✓</span>局部暗度阈值</button>
          <button class="method on" data-method="difference"><span class="tick">✓</span>时序背景差分</button>
          <button class="method on" data-method="learned"><span class="tick">✓</span>U-Net 时序</button>
        </div>
        <div id="modelField">
          <span class="lbl">模型部署 JSON</span>
          <input type="text" id="modelPath" placeholder="留空用默认权重" />
        </div>
      </section>

      <details>
        <summary>高级</summary>
        <button class="btn btn-sm" id="btnReloadRuns" style="margin-top:16px; width:100%;">重新扫描 runs/</button>
        <div class="grid-2">
          <fieldset><span class="lbl">阈值</span><input type="number" id="advThreshold" step="0.01" placeholder="自动" /></fieldset>
          <fieldset><span class="lbl">最小面积</span><input type="number" id="advMinArea" value="4" min="1" /></fieldset>
          <fieldset><span class="lbl">关联门限</span><input type="number" id="advGate" value="12" step="0.5" /></fieldset>
          <fieldset><span class="lbl">匹配 IoU</span><input type="number" id="advIou" value="0.5" step="0.05" /></fieldset>
        </div>
        <fieldset style="margin-top:8px;"><span class="lbl">序列路径（手动输入）</span>
          <input type="text" id="seqPath" placeholder="粘贴绝对路径，回车加载" />
        </fieldset>
      </details>

      <div class="rail-foot">
        <button class="btn btn-primary run-btn" id="btnRun">运行检测</button>
        <span class="badge" id="runBadge">待运行</span>
      </div>
    </aside>

    <!-- ============ stage ============ -->
    <main class="stage">
      <div class="stage-bar">
        <span class="mono" id="frameLabel" style="font-size:13px; color:var(--on-2); min-width:84px;">帧 0 / 0</span>
        <button class="play-btn" id="btnPlay" aria-label="播放/暂停"><span id="playIcon" style="display:inline-flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span><span id="playLabel">播放</span></button>
        <button class="icon-btn" id="btnPrev" title="上一帧 (←)" aria-label="上一帧"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6z"/><path d="M20 5v14l-10-7z"/></svg></button>
        <button class="icon-btn" id="btnNext" title="下一帧 (→)" aria-label="下一帧"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 5h-2v14h2z"/><path d="M4 5v14l10-7z"/></svg></button>
        <div class="seg" id="viewSeg" style="margin-left:12px;">
          <button data-view="compare" class="on">并排</button>
          <button data-view="quad">四宫格</button>
        </div>
        <span style="flex:1;"></span>
        <button class="btn btn-sm" id="btnAllMetrics">全部指标</button>
        <div class="pop-wrap">
      <button class="btn btn-sm" id="btnDisplay">显示</button>
      <div class="popover hidden" id="displayPop">
        <div class="row"><span class="lbl">灰度映射</span><select id="dispMode"></select></div>
        <div class="row"><span class="lbl">伪彩色</span><select id="dispCmap"></select></div>
        <div class="row"><span class="lbl">差分参考</span>
          <select id="dispDiff"><option value="median">短期历史中值</option><option value="previous">前一帧</option></select>
        </div>
        <label class="switch-row"><span>轻度去斑平滑</span><input type="checkbox" id="dispDenoise" /></label>
        <label class="switch-row"><span><span class="dot" style="background:var(--viz-truth)"></span>真值轮廓</span><input type="checkbox" id="dispTruth" checked /></label>
        <label class="switch-row"><span><span class="dot" style="background:var(--viz-pred)"></span>预测轮廓</span><input type="checkbox" id="dispPred" checked /></label>
        <label class="switch-row"><span>像素锐化缩放</span><input type="checkbox" id="dispPixelated" checked /></label>
      </div>
    </div>
  
        <select id="fps">
          <option value="4">4 FPS</option>
          <option value="8" selected>8 FPS</option>
          <option value="12">12 FPS</option>
          <option value="16">16 FPS</option>
        </select>
      </div>

      <div class="empty-note" id="stageEmpty">左侧选好序列与模型，点「运行检测」。已有结果会自动载入。</div>

      <div class="columns pixelated hidden" id="columns"></div>

      <div class="quad hidden" id="quad"></div>
      <div class="quad-bar hidden" id="quadBar">
        <select id="quadSource" style="max-width:220px;"></select>
        <button class="btn btn-sm" id="btnGif">导出 GIF</button>
        <button class="btn btn-sm" id="btnMp4">导出 MP4</button>
        <span class="lbl" id="exportStatus"></span>
      </div>

      <div class="video-stage hidden" id="videoStage">
        <video id="videoOverlay" controls playsinline></video>
        <div class="row" id="videoDownloads" style="display:flex; gap:8px;"></div>
      </div>

      <div class="hint-line hidden" id="colHint"></div>
      <div class="pills hidden" id="pills"></div>
      <div class="strip hidden" id="strip"></div>
      <div class="run-steps hidden" id="logWrap">
        <div class="run-head">
          <span class="dots" id="runDots"><i></i><i></i><i></i></span>
          <span class="run-title" id="runTitle">正在运行…</span>
          <button class="link-btn" id="btnRawLog">原始日志</button>
        </div>
        <div class="steps-body">
          <div class="steps" id="steps"></div>
          <pre class="terminal hidden" id="log"></pre>
        </div>
      </div>

      <div class="sheet hidden" id="metricSheet">
        <div class="sheet-card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <b style="font-size:14px; font-weight:500;">全部指标</b>
            <button class="btn btn-sm" id="btnCloseSheet">关闭</button>
          </div>
          <table class="metrics" id="metricTable"></table>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/app.js?v=4"></script>
</body>
</html>
