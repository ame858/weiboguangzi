<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ka 视频 SAR · 动目标阴影对比</title>
  <style>
    :root {
      --bg: #f0f4f9;
      --surface: #ffffff;
      --tonal: #f8fafd;
      --sunken: #eef2f8;
      --line: #e3e8ef;
      --line-strong: #c4c7c5;
      --text: #1f1f1f;
      --text-2: #444746;
      --text-3: #747775;
      --primary: #0b57d0;
      --primary-hover: #0842a0;
      --primary-soft: #d3e3fd;
      --on-soft: #041e49;
      --ok: #1e8e3e;
      --ok-bg: #e6f4ea;
      --warn: #b06000;
      --warn-bg: #fef7e0;
      --err: #c5221f;
      --err-bg: #fce8e6;
      --pill: 9999px;
      --shadow: 0 1px 2px rgba(60,64,67,.06), 0 1px 3px 1px rgba(60,64,67,.04);
      --sans: "Google Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "JetBrains Mono", "Roboto Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
      font-size: 13.5px; line-height: 1.5; -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ---------- top ---------- */
    .top {
      flex: 0 0 auto; height: 56px; display: flex; align-items: center; gap: 14px;
      padding: 0 20px; background: rgba(240,244,249,.9); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line); z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .brand-icon {
      width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: #fff;
      background: linear-gradient(135deg, #1a73e8, #0b57d0); box-shadow: 0 2px 6px rgba(11,87,208,.24);
    }
    .brand b { font-size: 14px; font-weight: 500; letter-spacing: -.1px; }
    .ctx {
      display: inline-flex; align-items: center; gap: 8px; min-width: 0;
      padding: 6px 14px; border-radius: var(--pill); background: var(--surface); box-shadow: var(--shadow);
      font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ctx b { font-weight: 500; color: var(--text); }
    .ctx .sep { color: var(--line-strong); }
    .ctx-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); flex-shrink: 0; }
    .ctx.live .ctx-dot { background: var(--ok); }
    .top-spacer { flex: 1; }

    /* ---------- shell ---------- */
    .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 268px minmax(0, 1fr); }

    /* ---------- rail ---------- */
    .rail {
      min-height: 0; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line);
      padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px;
    }
    .rail section { display: flex; flex-direction: column; gap: 7px; }
    .rail h2 {
      margin: 0; font-size: 10.5px; font-weight: 500; letter-spacing: .08em;
      text-transform: uppercase; color: var(--text-3);
    }
    .seg { display: inline-flex; background: var(--sunken); border-radius: var(--pill); padding: 3px; gap: 2px; }
    .seg button {
      flex: 1; border: none; background: transparent; color: var(--text-2); padding: 5px 10px;
      border-radius: var(--pill); cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 500;
      transition: .15s; white-space: nowrap;
    }
    .seg button:hover { color: var(--text); }
    .seg button.on { background: var(--surface); color: var(--primary); box-shadow: 0 1px 3px rgba(60,64,67,.14); }

    input[type="text"], input[type="number"], select {
      width: 100%; background: var(--sunken); color: var(--text); border: 1.5px solid transparent;
      border-radius: 10px; padding: 8px 10px; font-family: inherit; font-size: 12px; outline: none;
      transition: background .15s, border-color .15s, box-shadow .15s;
    }
    input:hover, select:hover { background: #e9eef6; }
    input:focus, select:focus { background: var(--surface); border-color: var(--primary); box-shadow: 0 0 0 3px rgba(11,87,208,.12); }

    .method-list { display: flex; flex-direction: column; gap: 6px; }
    .method {
      display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 10px;
      border: 1.5px solid var(--line); background: var(--surface); cursor: pointer;
      font-family: inherit; font-size: 12.5px; color: var(--text-2); text-align: left; transition: .15s;
    }
    .method:hover { border-color: var(--line-strong); }
    .method .tick {
      width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--line-strong);
      flex-shrink: 0; display: grid; place-items: center; color: transparent; font-size: 9px;
    }
    .method.on { border-color: var(--primary); background: #eef4fe; color: var(--text); }
    .method.on .tick { background: var(--primary); border-color: var(--primary); color: #fff; }
    .method small { margin-left: auto; font-size: 10.5px; color: var(--text-3); }

    .rail details { border-top: 1px solid var(--line); padding-top: 9px; }
    .rail summary { cursor: pointer; font-size: 11.5px; color: var(--text-3); list-style: none; }
    .rail summary::-webkit-details-marker { display: none; }
    .rail summary::after { content: " ▾"; }
    .rail details[open] summary::after { content: " ▴"; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    fieldset { border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .lbl { font-size: 10.5px; color: var(--text-3); }

    .rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 10px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 14px; border-radius: var(--pill); border: 1px solid var(--line-strong);
      background: var(--surface); color: var(--text); font-family: inherit; font-size: 12.5px;
      font-weight: 500; cursor: pointer; white-space: nowrap; transition: .15s;
    }
    .btn:hover { background: var(--tonal); border-color: #9aa0a6; }
    .btn-sm { padding: 5px 11px; font-size: 11.5px; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    .run-btn { width: 100%; height: 38px; font-size: 13px; }

    .badge {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 3px 9px; border-radius: var(--pill); font-size: 11px; font-weight: 500;
      background: var(--sunken); color: var(--text-2); white-space: nowrap;
    }
    .badge.ok { background: var(--ok-bg); color: var(--ok); }
    .badge.warn { background: var(--warn-bg); color: var(--warn); }
    .badge.err { background: var(--err-bg); color: var(--err); }

    /* ---------- stage ---------- */
    .stage { min-height: 0; display: flex; flex-direction: column; padding: 10px 18px 12px; gap: 10px; position: relative; }
    .stage-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .icon-btn {
      width: 30px; height: 30px; border-radius: 50%; border: none; background: transparent;
      color: var(--text-2); cursor: pointer; display: inline-grid; place-items: center; font-size: 11px;
    }
    .icon-btn:hover { background: var(--sunken); color: var(--text); }
    .play-btn {
      height: 30px; padding: 0 14px; border-radius: var(--pill); border: none; background: var(--primary);
      color: #fff; font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .play-btn:hover { background: var(--primary-hover); }
    .stage-bar select { width: auto; padding: 5px 10px; border-radius: var(--pill); background: var(--surface); }

    .columns {
      flex: 1; min-height: 180px; display: grid; gap: 14px; justify-content: center;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; max-width: 680px; }
    .col-head { display: flex; align-items: center; gap: 8px; padding: 0 2px 7px; font-size: 12px; }
    .col-head select {
      width: auto; max-width: 62%; padding: 4px 8px; border-radius: 8px; font-size: 12px;
      font-weight: 500; background: var(--surface); box-shadow: var(--shadow);
    }
    .col-head .f1 { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--text-3); }
    /* The frame itself carries the dark backdrop, so a 64x80 portrait frame does
       not sit inside a 4x wider black rectangle. */
    .col-img {
      flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    }
    .col-img img {
      height: 100%; width: auto; max-width: 100%; display: block;
      border-radius: 12px; background: #0d1117;
    }
    .col-foot {
      display: flex; gap: 12px; padding: 6px 2px 0; font-size: 11px; color: var(--text-3);
      font-family: var(--mono); white-space: nowrap;
    }
    .col-foot .hot { color: var(--text-2); }
    .slot-empty {
      flex: 1; min-height: 0; width: 100%; cursor: pointer; font-family: inherit;
      border: 1.5px dashed var(--line-strong); border-radius: 12px; background: var(--tonal);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      color: var(--text-3); font-size: 12.5px; padding: 16px; text-align: center; transition: .15s;
    }
    .slot-empty:hover { border-color: var(--primary); color: var(--primary); background: #f5f9ff; }
    .slot-empty select { width: auto; min-width: 140px; background: var(--surface); }
    .add-slot {
      display: grid; place-items: center; border: 1.5px dashed var(--line-strong); border-radius: 12px;
      background: transparent; color: var(--text-3); cursor: pointer; font-family: inherit; font-size: 12.5px;
      transition: .15s;
    }
    .add-slot:hover { border-color: var(--primary); color: var(--primary); background: #f5f9ff; }

    .pixelated img { image-rendering: pixelated; }
    .quad { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; }
    .quad figure { margin: 0; display: flex; flex-direction: column; min-height: 0; }
    .quad figcaption { font-size: 10.5px; color: var(--text-3); padding: 0 2px 5px; display: flex; justify-content: space-between; }
    .quad .col-img { border-radius: 10px; background: #0d1117; overflow: hidden; }
    .quad .col-img img { width: 100%; height: 100%; object-fit: contain; border-radius: 0; background: transparent; }
    .quad-bar { flex: 0 0 auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .pills { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .pillcard {
      background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 8px 12px;
      display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-width: 0;
    }
    .pillcard span { font-size: 10.5px; color: var(--text-3); white-space: nowrap; }
    .pillcard b {
      font-family: var(--mono); font-size: 16px; font-weight: 500; letter-spacing: -.3px;
      display: inline-flex; align-items: baseline; gap: 7px;
    }
    .pillcard b em { font-style: normal; font-size: 11px; font-weight: 500; }
    .pillcard .up { color: var(--ok); }
    .pillcard .down { color: var(--err); }

    .strip { flex: 0 0 auto; display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 4px; min-height: 58px; }
    .strip button {
      flex: 0 0 auto; padding: 0; border: 2px solid transparent; border-radius: 7px; background: #0d1117;
      cursor: pointer; overflow: hidden; line-height: 0; position: relative;
    }
    .strip button img { display: block; height: 44px; width: auto; }
    .strip button.on { border-color: var(--primary); }
    .strip button i {
      position: absolute; right: 2px; bottom: 0; font-style: normal; font-size: 9px;
      font-family: var(--mono); color: #cfd8e6; background: rgba(0,0,0,.55); padding: 0 3px; border-radius: 3px;
    }

    .hint-line { flex: 0 0 auto; font-size: 11.5px; color: var(--text-3); }
    .empty-note {
      flex: 1; display: grid; place-items: center; text-align: center; color: var(--text-3);
      font-size: 12.5px; border: 1.5px dashed var(--line); border-radius: 14px; background: var(--tonal);
      padding: 20px;
    }
    .terminal {
      flex: 0 0 auto; max-height: 120px; overflow: auto; margin: 0; background: #1e222a; color: #d7e3f4;
      border-radius: 10px; padding: 10px 12px; font-family: var(--mono); font-size: 11px;
      line-height: 1.5; white-space: pre-wrap; word-break: break-all;
    }

    .pop-wrap { position: relative; }
    .popover {
      position: absolute; right: 0; top: 34px; z-index: 30; width: 248px; background: var(--surface);
      border-radius: 14px; box-shadow: 0 6px 20px rgba(60,64,67,.16); border: 1px solid var(--line);
      padding: 12px 14px;
    }
    .popover .row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .popover .row:last-child { margin-bottom: 0; }
    .switch-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 4px 0; font-size: 12px; color: var(--text-2); cursor: pointer;
    }
    .switch-row input[type="checkbox"] {
      appearance: none; -webkit-appearance: none; width: 32px; height: 18px; background: #dce1e8;
      border-radius: var(--pill); position: relative; cursor: pointer; margin: 0; flex-shrink: 0;
      transition: background .2s;
    }
    .switch-row input[type="checkbox"]::after {
      content: ""; position: absolute; top: 2.5px; left: 2.5px; width: 13px; height: 13px;
      border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2);
      transition: transform .2s cubic-bezier(.2,0,0,1);
    }
    .switch-row input[type="checkbox"]:checked { background: var(--primary); }
    .switch-row input[type="checkbox"]:checked::after { transform: translateX(14px); }
    .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 5px; }

    .sheet {
      position: absolute; inset: 0; z-index: 25; background: rgba(240,244,249,.72);
      backdrop-filter: blur(3px); display: flex; padding: 24px;
    }
    .sheet-card {
      margin: auto; width: min(920px, 100%); max-height: 100%; overflow: auto;
      background: var(--surface); border-radius: 18px; box-shadow: 0 10px 32px rgba(60,64,67,.18);
      padding: 18px 22px;
    }
    table.metrics { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.metrics th, table.metrics td { padding: 8px 12px; text-align: right; border-bottom: 1px solid var(--line); }
    table.metrics th:first-child, table.metrics td:first-child { text-align: left; color: var(--text-2); font-weight: 400; }
    table.metrics thead th { font-size: 11.5px; color: var(--text-3); font-weight: 500; }
    table.metrics td.val { font-family: var(--mono); font-size: 13px; font-weight: 500; }
    table.metrics .delta { font-family: var(--mono); font-size: 10.5px; margin-left: 5px; }
    table.metrics .delta.up { color: var(--ok); }
    table.metrics .delta.down { color: var(--err); }
    table.metrics .delta.flat { color: var(--text-3); }

    .video-stage { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
    video { width: 100%; height: 100%; min-height: 0; object-fit: contain; border-radius: 12px; background: #0d1117; }
    .file-box { background: var(--sunken); border: 1.5px dashed var(--line-strong); border-radius: 10px; padding: 5px 8px; }
    input[type="file"] { width: 100%; font-size: 11px; color: var(--text-2); cursor: pointer; }
    input[type="file"]::file-selector-button {
      margin-right: 8px; padding: 4px 10px; border-radius: var(--pill); border: none;
      background: var(--primary-soft); color: var(--on-soft); font-family: inherit; font-size: 11px;
      font-weight: 500; cursor: pointer;
    }
    .crop-stage { background: #0d1117; border-radius: 10px; padding: 6px; display: flex; justify-content: center; }
    #cropCanvas { max-width: 100%; max-height: 200px; cursor: crosshair; display: block; border-radius: 6px; }

    .hidden { display: none !important; }

    @media (max-width: 1100px) {
      .app { grid-template-columns: 240px minmax(0, 1fr); }
      .pills { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 820px) {
      body { overflow: auto; }
      .app { display: block; }
      .rail { border-right: none; border-bottom: 1px solid var(--line); }
      .columns { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9" opacity=".45"></circle>
          <circle cx="12" cy="12" r="4.5"></circle>
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path>
        </svg>
      </div>
      <b>Ka 视频 SAR · 阴影对比</b>
    </div>
    <div class="ctx" id="ctxChip"><span class="ctx-dot"></span><span id="ctxText">未选择输入</span></div>
    <div class="top-spacer"></div>
    <button class="btn btn-sm" id="btnAllMetrics">全部指标</button>
    <div class="pop-wrap">
      <button class="btn btn-sm" id="btnDisplay">显示</button>
      <div class="popover hidden" id="displayPop">
        <div class="row"><span class="lbl">灰度映射</span><select id="dispMode"></select></div>
        <div class="row"><span class="lbl">伪彩色</span><select id="dispCmap"></select></div>
        <div class="row"><span class="lbl">差分参考</span>
          <select id="dispDiff"><option value="median">短期历史中值</option><option value="previous">前一帧</option></select>
        </div>
        <label class="switch-row"><span>轻度去斑平滑</span><input type="checkbox" id="dispDenoise" /></label>
        <label class="switch-row"><span><span class="dot" style="background:#1e8e3e"></span>真值轮廓</span><input type="checkbox" id="dispTruth" checked /></label>
        <label class="switch-row"><span><span class="dot" style="background:#d93025"></span>预测轮廓</span><input type="checkbox" id="dispPred" checked /></label>
        <label class="switch-row"><span>像素锐化缩放</span><input type="checkbox" id="dispPixelated" checked /></label>
      </div>
    </div>
  </header>

  <div class="app">
    <!-- ============ rail ============ -->
    <aside class="rail">
      <section>
        <h2>输入</h2>
        <div class="seg" id="kindSeg">
          <button data-kind="sequence" class="on">图像序列</button>
          <button data-kind="video">实测视频</button>
        </div>
        <div id="seqPane" style="display:flex; flex-direction:column; gap:7px;">
          <select id="seqSelect"></select>
          <input type="text" id="seqPath" placeholder="或粘贴序列绝对路径，回车" />
        </div>
        <div id="videoPane" class="hidden" style="display:flex; flex-direction:column; gap:7px;">
          <div class="file-box"><input type="file" id="videoFile" accept=".mp4,.mov,.avi,.mkv" /></div>
          <input type="text" id="videoPath" placeholder="或本地视频路径" />
          <button class="btn btn-sm" id="btnVideoLoad">读取首帧</button>
        </div>
        <button class="btn btn-sm" id="btnReloadRuns">重新扫描 runs/</button>
      </section>

      <section id="cropSection" class="hidden">
        <h2>识别区域</h2>
        <div class="crop-stage"><canvas id="cropCanvas"></canvas></div>
        <div class="lbl">首帧 <span id="dimLabel" class="mono"></span> · 拖拽框选</div>
        <label class="switch-row"><span>启用裁剪</span><input type="checkbox" id="useCrop" /></label>
        <div class="grid-2">
          <fieldset><span class="lbl">X</span><input type="number" id="cropX" min="0" value="0" /></fieldset>
          <fieldset><span class="lbl">Y</span><input type="number" id="cropY" min="0" value="0" /></fieldset>
          <fieldset><span class="lbl">宽</span><input type="number" id="cropW" min="2" value="100" /></fieldset>
          <fieldset><span class="lbl">高</span><input type="number" id="cropH" min="2" value="100" /></fieldset>
        </div>
        <button class="btn btn-sm" id="btnResetCrop">重置整幅</button>
      </section>

      <section>
        <h2>模型</h2>
        <div class="method-list" id="methodList">
          <button class="method on" data-method="threshold"><span class="tick">✓</span>局部暗度阈值<small>传统</small></button>
          <button class="method on" data-method="difference"><span class="tick">✓</span>时序背景差分<small>传统</small></button>
          <button class="method on" data-method="learned"><span class="tick">✓</span>U-Net 时序<small>学习</small></button>
        </div>
        <div id="modelField">
          <span class="lbl">模型部署 JSON</span>
          <input type="text" id="modelPath" placeholder="留空用默认权重" />
        </div>
      </section>

      <details>
        <summary>参数</summary>
        <div class="grid-2">
          <fieldset><span class="lbl">阈值</span><input type="number" id="advThreshold" step="0.01" placeholder="自动" /></fieldset>
          <fieldset><span class="lbl">最小面积</span><input type="number" id="advMinArea" value="4" min="1" /></fieldset>
          <fieldset><span class="lbl">关联门限</span><input type="number" id="advGate" value="12" step="0.5" /></fieldset>
          <fieldset><span class="lbl">匹配 IoU</span><input type="number" id="advIou" value="0.5" step="0.05" /></fieldset>
        </div>
      </details>

      <div class="rail-foot">
        <button class="btn btn-primary run-btn" id="btnRun">运行检测</button>
        <span class="badge" id="runBadge">待运行</span>
      </div>
    </aside>

    <!-- ============ stage ============ -->
    <main class="stage">
      <div class="stage-bar">
        <span class="mono" id="frameLabel" style="font-size:12px; color:var(--text-2); min-width:66px;">帧 0 / 0</span>
        <button class="play-btn" id="btnPlay">▶ 播放</button>
        <button class="icon-btn" id="btnPrev" title="上一帧 (←)">◀</button>
        <button class="icon-btn" id="btnNext" title="下一帧 (→)">▶</button>
        <div class="seg" id="viewSeg" style="margin-left:12px;">
          <button data-view="compare" class="on">并排</button>
          <button data-view="quad">四宫格</button>
        </div>
        <select id="fps" style="margin-left:auto;">
          <option value="4">4 FPS</option>
          <option value="8" selected>8 FPS</option>
          <option value="12">12 FPS</option>
          <option value="16">16 FPS</option>
        </select>
      </div>

      <div class="empty-note" id="stageEmpty">左侧选好序列与模型，点「运行检测」。已有结果会自动载入。</div>

      <div class="columns pixelated hidden" id="columns"></div>

      <div class="quad hidden" id="quad"></div>
      <div class="quad-bar hidden" id="quadBar">
        <select id="quadSource" style="max-width:220px;"></select>
        <button class="btn btn-sm" id="btnGif">导出 GIF</button>
        <button class="btn btn-sm" id="btnMp4">导出 MP4</button>
        <span class="lbl" id="exportStatus"></span>
      </div>

      <div class="video-stage hidden" id="videoStage">
        <video id="videoOverlay" controls playsinline></video>
        <div class="row" id="videoDownloads" style="display:flex; gap:8px;"></div>
      </div>

      <div class="hint-line hidden" id="colHint"></div>
      <div class="pills hidden" id="pills"></div>
      <div class="strip hidden" id="strip"></div>
      <pre class="terminal hidden" id="log"></pre>

      <div class="sheet hidden" id="metricSheet">
        <div class="sheet-card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <b style="font-size:14px; font-weight:500;">全部指标</b>
            <button class="btn btn-sm" id="btnCloseSheet">关闭</button>
          </div>
          <table class="metrics" id="metricTable"></table>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/app.js?v=4"></script>
</body>
</html>
